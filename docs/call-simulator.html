<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigillo: call simulator</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1b1d22;--mut:#5d6370;--line:#dedbd2;--acc:#1f4fd8;--acc2:#e8eefc;--ok:#1a7f4b;--okbg:#e3f4ea;--bad:#b3261e;--badbg:#fbe9e7;--warn:#8a5a00;--warnbg:#fff3d6}
@media(prefers-color-scheme:dark){:root{--bg:#121418;--card:#1b1e25;--ink:#ecedf0;--mut:#9aa1ad;--line:#2d313b;--acc:#7da2ff;--acc2:#1f2a47;--ok:#6fd6a0;--okbg:#14301f;--bad:#ff8f86;--badbg:#3a1a17;--warn:#f0c46a;--warnbg:#38290a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:26px;margin:8px 0 4px}
h2{font-size:20px;margin:0 0 8px}
p{margin:0 0 12px}
.mut{color:var(--mut);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
@media(prefers-color-scheme:dark){button.pri{color:#0b1020}}
button.big{width:100%;text-align:left;padding:14px 16px;margin:0 0 10px}
button.big b{display:block}
button.big span{color:var(--mut);font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--acc2);color:var(--acc)}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.av{width:44px;height:44px;border-radius:50%;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.q{font-size:20px;font-weight:600;line-height:1.4;margin:6px 0 14px}
textarea{width:100%;min-height:120px;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.box{border-radius:12px;padding:14px 16px;margin:12px 0}
.say{background:var(--okbg);border-left:4px solid var(--ok)}
.avoid{background:var(--badbg);border-left:4px solid var(--bad)}
.tip{background:var(--warnbg);border-left:4px solid var(--warn)}
.box h3{margin:0 0 6px;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
label.pt{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
label.pt:last-child{border:0}
input[type=checkbox]{width:20px;height:20px;margin-top:3px;flex:none}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--acc)}
.score{font-size:44px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.star{font-size:22px;background:none;border:0;padding:4px 8px}
.star.on{color:#e0a100}
.hide{display:none}
.timer{font-variant-numeric:tabular-nums;color:var(--mut)}
a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";
/* ---------------------------------------------------------------
   CONTENT. Facts follow docs/PROJECT-KNOWLEDGE.md and the partner call kit.
   Rules baked in: never say "tamper-proof", "compliant", "AI Act ready", "open source",
   "certified", "secure". Never invent numbers, customers or dates. Price is indicative.
   Fields: c = category, p = persona, q = question, say = model answer,
   pts = key points to cover, avoid = things not to say,
   push = {q, say} what a tough client says next, tip = coaching note.
---------------------------------------------------------------- */
var PERSONAS={
 marco:{n:"Marco",r:"CTO, fintech scale-up"},
 elena:{n:"Elena",r:"Head of Compliance, insurance"},
 tom:{n:"Tom",r:"Founder, AI agency"},
 sofia:{n:"Sofia",r:"Legal counsel"},
 jan:{n:"Jan",r:"Head of HR tech"}
};
var CATS={basics:"The basics",vs:"Why not logs / alternatives",data:"Data and privacy",sec:"Security",legal:"AI Act, GDPR, legal",tech:"Technical fit",biz:"Price and business",trust:"Trust and tricky",close:"Closing"};

var Q=[
{id:"what",c:"basics",p:"tom",
 q:"I only have two minutes. What exactly is Sigillo?",
 say:"It is a black box for AI agents. Every action an agent takes gets a signed receipt, and anyone can check later that nothing was changed, added or removed. We keep fingerprints, never your content.",
 pts:["Black box / flight recorder comparison","Signed receipts for what the agent does","Anyone can check it was not changed","Fingerprints only, not content"],
 avoid:["“Tamper-proof”","“AI Act ready” or “compliant”","Long technical words (Merkle, Ed25519)"],
 tip:"Use their own problem from the discovery questions in the first sentence."},
{id:"who-needs",c:"basics",p:"elena",
 q:"Why would a company like ours need this?",
 say:"When an agent touches contracts, money, hiring or personal data, someone will eventually ask: what really happened? Sigillo gives you a record you can show to a customer, an auditor or a lawyer, and nobody can quietly rewrite it afterwards.",
 pts:["Starts from a real situation: someone asks what happened","Names the audience: customer, auditor, lawyer","Record cannot be quietly rewritten"],
 avoid:["Scaring them with fines","Saying the law forces them to buy it"],
 push:{q:"Nobody has ever asked us for that.",say:"That is fair, and it is common today. The usual trigger is the first dispute or the first big customer's security review. Has a customer ever asked how you control what the agent does? A small test now costs you nothing and means you are ready when it happens."},
 tip:"If they say no one asked, do not argue. Ask one more discovery question."},
{id:"fear-not-seatbelt",c:"basics",p:"marco",
 q:"Does Sigillo stop the agent from making mistakes?",
 say:"No. It is a black box, not a seatbelt. It does not prevent the problem. It makes sure you can show exactly what happened and that the record was not touched afterwards.",
 pts:["Clear no","Black box, not a seatbelt","Value = proof of what happened"],
 avoid:["Promising it makes agents safer","Suggesting it blocks bad actions"]},
{id:"logs",c:"vs",p:"marco",
 q:"We already have logs. What is different?",
 say:"Logs are written and stored by the same system, so they can be edited, and a third party has little reason to trust them. Sigillo receipts are signed with a key the agent does not hold, chained one to the next, and anyone can check them with an outside program, without trusting you or us.",
 pts:["Logs can be edited by the same system","Signed with a key the agent does not hold","Chained: removing or reordering is noticed","Checked by an independent program"],
 avoid:["Saying logs are useless","Saying receipts can never be attacked"],
 push:{q:"We could just write our logs to write-once storage.",say:"You could, and that is a good practice. The difference is who vouches for the record. With Sigillo a third party can verify it independently, and every action is signed and chained, so a missing or reordered step is named. If you already have that, tell me what is still missing for your auditors and I will take it to our engineer."}},
{id:"diy",c:"vs",p:"tom",
 q:"Can't we just build this ourselves?",
 say:"You can log, yes. The difference is who can change the record. Your own logs are written and kept by you. A sealed record, checked by an outside program, is different. And building signing, chaining and independent verification properly takes time that is not your core business.",
 pts:["Acknowledge they can log","Key difference: who can change the record","Independent verification is the hard part"],
 avoid:["Making them feel stupid","Claiming it is impossible to build"]},
{id:"competitor",c:"vs",p:"marco",
 q:"A competitor offers qualified eIDAS timestamps. Why not them?",
 say:"Some competitors have stronger legal marks, and I will not pretend otherwise. Sigillo connects to your existing agent as it is, with nothing to rewrite, and it is built for Europe. If a qualified timestamp is a must-have for you, please tell me. That is valuable for us to know.",
 pts:["Honest: others may have stronger legal marks","Our strength: connects to the agent as it is","Asks if qualified timestamp is a must-have"],
 avoid:["Criticising a competitor by name","Saying our timestamp is qualified (it is not)"],
 tip:"Our current timestamp comes from a free public service (FreeTSA). It is not an eIDAS qualified timestamp."},
{id:"content",c:"data",p:"elena",
 q:"Do you see our data and prompts?",
 say:"No. We store only fingerprints of prompts, tool inputs and outputs, never the text. By default the fingerprint is made on your own side, so the text does not even reach our server.",
 pts:["Clear no on storing content","Fingerprints (hashes) only","Fingerprint made on their side by default"],
 avoid:["“We can never see anything” without the exception","Saying “cannot see content” in absolute terms"],
 push:{q:"What about the model gateway I read about?",say:"Good that you ask. If you use our optional model gateway, the text passes through our server's memory during the call and is not saved. The default setup does not do that. I will send you the exact description, and it is a choice you make."},
 tip:"Honest limit: with the optional gateway, text passes through server memory. Say it if asked."},
{id:"training",c:"data",p:"sofia",
 q:"Do you use our data to train anything?",
 say:"No. We do not store the content, so there is nothing to train on.",
 pts:["Clear no","Reason: content is not stored"],
 avoid:["Long explanations","Promising anything about third-party models they use"]},
{id:"where",c:"data",p:"elena",
 q:"Where is the data stored, and who can access the servers?",
 say:"On a server in Europe. Access is limited to our technical team, and there is an encrypted daily backup. One honest limit: whoever has administrator access to a server could read what is stored, which is fingerprints and account details, not your content.",
 pts:["Server in Europe","Limited access","Encrypted daily backup","Honest limit about admin access","What is stored: fingerprints and account details"],
 avoid:["“Nobody can ever access it”","Naming the provider or IP"]},
{id:"erasure",c:"data",p:"sofia",
 q:"Receipts cannot be deleted. How do we respect the right to erasure?",
 say:"Receipts hold fingerprints and a pseudonym, not names. To erase a person we delete the link between the pseudonym and the person, so the receipt no longer points to anyone, and the chain stays valid. A tip for your developers: never write personal data in free-text names such as the agent or action name.",
 pts:["Receipts hold pseudonyms, not names","Erase the link, not the receipt","Chain stays valid","Tip: no personal data in free-text names"],
 avoid:["Saying receipts can be deleted","Saying GDPR does not apply"],
 tip:"If it gets legal, use the rescue: “Your lawyer and our team can go through it in a short call.”"},
{id:"keys",c:"data",p:"marco",
 q:"What happens with our model API keys if we give them to you?",
 say:"They are stored encrypted and only the last 4 digits are shown. To call the model for you, though, our system has to open the key in memory, so I will not claim nobody at Sigillo could ever see it. The safest option is not to give us a key at all, and that works for the basic setup.",
 pts:["Encrypted, last 4 digits visible","Honest: system must open it to call the model","Safest: not handing over a key"],
 avoid:["“Invisible even to us”","“Impossible to leak”"],
 tip:"Say this only if they ask about keys. The key vault with a passphrase is paused, so do not mention it."},
{id:"fake",c:"sec",p:"marco",
 q:"Can you, or a hacker, fake or change a receipt?",
 say:"Each receipt is signed with a key kept in a separate process on our side, which the agent never holds. Receipts cannot be edited or deleted, and any change is detected by the checker. A fingerprint of the chain also goes to a public timestamp service.",
 pts:["Key in a separate process, agent never holds it","Changes are detected","Public timestamp of the chain"],
 avoid:["“Impossible to fake”","“Unhackable”"],
 push:{q:"But you hold the key. So you could fake it.",say:"Correct, the signing key is ours. That is exactly why the external timestamp and the independent checker exist, so changes after the fact can be noticed. For the full threat model I would like to bring our engineer to a technical call."},
 tip:"Honest limit: a valid key can sign invented actions, so Sigillo proves the record was not changed, not that it is true."},
{id:"audit",c:"sec",p:"elena",
 q:"Have you been penetration-tested or audited? SOC 2? ISO 27001?",
 say:"No. We have our own design, automated tests and reviews. No certification and no external audit yet; an independent review is planned. I prefer to tell you that now.",
 pts:["Plain no","What exists: own design, tests, reviews","Independent review is planned","Says it before they find out"],
 avoid:["“Secure”, “hardened”, “certified”","Inventing a date for the audit"],
 push:{q:"Then how can we trust it with sensitive agents?",say:"That is why we suggest a free pilot on one agent and why the system stores fingerprints, not your content. I can send you a description of what is stored and how data flows, so your team can judge it. If an audit is a must for you, tell me and I will pass that to the team."}},
{id:"hacked",c:"sec",p:"sofia",
 q:"What happens if you are hacked?",
 say:"We have an incident plan: we tell our partner without undue delay and in any case within 48 hours, and they tell you, so you can meet the 72-hour GDPR deadline. Since we hold fingerprints and not content, there is no readable content to leak from the receipts.",
 pts:["There is an incident plan","Notification within 48 hours to the partner","Helps their 72-hour GDPR deadline","No readable content in receipts"],
 avoid:["“It cannot happen”","Promising compensation"]},
{id:"down",c:"sec",p:"marco",
 q:"What happens if Sigillo is down? Does our agent stop?",
 say:"Good question. The pilot has no guaranteed uptime, so some events could be missed. I will send you the exact behaviour in writing today.",
 pts:["No guaranteed uptime in the pilot","Some events could be missed","Promises the written answer today"],
 avoid:["“The agent keeps working”","“Nothing is lost”","Making up a percentage"],
 tip:"This is an open point: Giovanni has not confirmed the exact behaviour. After the call, write the question down and send it to him."},
{id:"court",c:"legal",p:"sofia",
 q:"Is a Sigillo receipt valid in court?",
 say:"It is strong technical evidence that a record was not changed. I will not tell you what a court will accept. The timestamp comes from a public service, not a qualified one. Your lawyer decides how to use it.",
 pts:["Strong technical evidence of no change","Does not promise court outcome","Timestamp is public, not qualified","Lawyer decides"],
 avoid:["“Legally valid”","“Proves in court”"]},
{id:"aiact",c:"legal",p:"elena",
 q:"Does Sigillo make us AI Act compliant?",
 say:"No tool alone does that. The AI Act asks for record-keeping for some AI systems, and Sigillo helps you keep a record that cannot be quietly altered. Whether your system is in scope is a question for your lawyer.",
 pts:["Clear no on “compliant”","Helps with record-keeping","Scope is for their lawyer"],
 avoid:["“AI Act ready”","“Compliant”","Quoting article numbers from memory"],
 push:{q:"So what do we actually get for the AI Act?",say:"Evidence. If your system has to keep logs, you can show a record that is signed, chained and checkable by anyone. It is one piece of the puzzle, not the whole thing."}},
{id:"gdpr-dpa",c:"legal",p:"sofia",
 q:"GDPR: who is the controller? Do we need a DPA?",
 say:"You decide what your agents record, so you are the controller. We have a draft data-handling description and a draft DPA. A lawyer still has to review them before paid customers, and I will ask Giovanni to send them.",
 pts:["They are the controller","Drafts exist, lawyer review pending","Does not send legal documents herself"],
 avoid:["Calling the DPA final","Sending legal documents on her own"]},
{id:"firebase",c:"legal",p:"sofia",
 q:"Your login uses Google. Does our email address leave the EU?",
 say:"Sign-in uses Firebase from Google, which may process the email address outside the EU under standard safeguards. That detail is still being confirmed with a lawyer, and I will send you the exact position.",
 pts:["Names Firebase / Google sign-in","Email may be processed outside the EU with safeguards","Position still being confirmed"],
 avoid:["“Everything stays in the EU”"]},
{id:"company",c:"legal",p:"sofia",
 q:"Who are you? Which company do we sign with?",
 say:"I will answer this in writing today.",
 pts:["Does not improvise","Promises a written answer","Sends the question to Giovanni after the call"],
 avoid:["Inventing a company name or structure","Saying “we are a startup based in …”"],
 tip:"The contract structure is Giovanni's decision. This is a rescue answer, so keep it calm and short."},
{id:"connect",c:"tech",p:"tom",
 q:"How do you connect to our agent? Do we have to change our code?",
 say:"A developer installs our small package and adds a few lines at the top of the agent, or we do it with you. The rest of the agent stays as it is. Python today. Our technical team connects it with you, in less than an hour.",
 pts:["Small package plus a few lines","Rest of the agent unchanged","Python today","Technical team helps"],
 avoid:["Promising other languages by a date","“Zero changes”"],
 push:{q:"Our agent is not in Python.",say:"Thank you for telling me. Today we support Python agents, and I do not want to promise more than that. I will note your language and ask our engineer what is possible, and I will come back to you."}},
{id:"record",c:"tech",p:"marco",
 q:"What exactly do you record?",
 say:"Each action the agent takes: what kind of action, when, and fingerprints of the inputs and outputs. Not the content itself.",
 pts:["Kind of action and time","Fingerprints of inputs and outputs","Not the content"],
 avoid:["Saying everything is recorded automatically"],
 tip:"Honest limit if pushed: Sigillo records what the agent reports. Unrecorded actions are unknown."},
{id:"frameworks",c:"tech",p:"tom",
 q:"Do you support LangChain, CrewAI, OpenAI, Anthropic?",
 say:"Python agents, including common frameworks and agents that call OpenAI-style models. For a specific framework or model I will confirm today, I do not want to say yes just to be nice.",
 pts:["Python, common frameworks","Does not say yes blindly","Promises to confirm today"],
 avoid:["Saying yes to a named framework without checking"]},
{id:"perf",c:"tech",p:"marco",
 q:"What is the performance impact on our agent?",
 say:"I do not have measured numbers, and I will not guess. I will ask the engineer for them today, and the pilot is the best way to measure it on your real agent.",
 pts:["Admits no numbers","Will not guess","Pilot measures it on their agent"],
 avoid:["Inventing milliseconds","“No impact”"]},
{id:"opensource",c:"tech",p:"tom",
 q:"Is it open source? Can we read the code?",
 say:"The checker is a small, readable program that anyone can run, even offline. The licensing terms are still being decided, so I will not call it open source yet.",
 pts:["The checker is small, readable, runs offline","Licensing still being decided","Does not say open source"],
 avoid:["“Open source”","Promising the code"]},
{id:"verify",c:"tech",p:"elena",
 q:"How do we verify a receipt ourselves, without you?",
 say:"With the checker program. It verifies the signature and the chain on your own computer, offline, without our servers. There is also a public page where you can drop an export and check it in the browser.",
 pts:["Checker runs on their computer","Works offline","No need to trust or contact Sigillo"],
 avoid:["Sounding like they need Sigillo to verify"],
 tip:"One honest note if asked: a pack alone shows “not modified”, not “from this customer”. The customer passes the short key code through another channel."},
{id:"volume",c:"tech",p:"marco",
 q:"Can you handle our volume? How many receipts?",
 say:"The standard plan covers up to 100,000 receipts a month. If you are far above that, we talk about a custom plan.",
 pts:["100,000 per month in standard","Custom plan above that"],
 avoid:["Promising a number of events per second"]},
{id:"api",c:"tech",p:"tom",
 q:"Is there an API? Can we export the data?",
 say:"Yes, there is a documented API, and receipts can be exported in a pack and checked offline. I will send the documentation to your developer.",
 pts:["Documented API","Export as a pack","Checked offline","Will send docs to developer"],
 avoid:["Promising integrations she has not seen"]},
{id:"price",c:"biz",p:"tom",
 q:"How much does it cost, really? Any extras?",
 say:"The pilot is free. The standard plan is indicatively from about 190 euro per month, including 100,000 receipts. It is indicative, and we confirm it together after the pilot.",
 pts:["Pilot is free","About 190 euro a month, indicative","Includes 100,000 receipts","Confirmed after the pilot"],
 avoid:["Quoting partner commissions or discounts","Multi-year terms","Final prices"],
 push:{q:"Can you do better on the price?",say:"The pilot lets us see together what you really use, and then we agree on the plan. I do not want to promise numbers I cannot confirm, so let me take it to the team and come back to you."},
 tip:"The price is provisional. “Indicative” is the word that protects her."},
{id:"pilot",c:"biz",p:"jan",
 q:"What is in the free pilot? What is the catch?",
 say:"The pilot connects one of your agents, with up to 10,000 receipts a month. In exchange we ask for feedback, a short case study if you are happy, and a contact. No uptime guarantee yet, which is one reason it is free.",
 pts:["One agent, 10,000 receipts per month","In return: feedback, case study, a contact","No guaranteed uptime"],
 avoid:["Hiding the exchange","“No obligations at all, ever”"]},
{id:"no-customers",c:"trust",p:"elena",
 q:"You have no customers yet. Why should we trust you?",
 say:"Fair. We are early, which is why the pilot is free and why I am telling you exactly what is not done yet: no audit, no certification. Early customers also shape the product.",
 pts:["Agrees calmly","Free pilot as the answer","States the gaps herself","Early customers shape the product"],
 avoid:["Inventing customers or logos","Getting defensive"]},
{id:"saving",c:"trust",p:"tom",
 q:"How does your encryption and key handling work internally, exactly? Algorithms, key rotation?",
 say:"That is a good technical question, and I do not want to guess. The exact detail is best from our engineer. May I set a 20-minute technical call with you and your developer?",
 pts:["No guessing","Hands it to the engineer","Turns it into a next step: technical call","Will write the question down"],
 avoid:["Making up algorithms","Pretending to know"],
 tip:"This is the rescue rule: one plain line, offer the technical call, note the question for Giovanni. It is a win, not a failure."},
{id:"roadmap",c:"trust",p:"marco",
 q:"When will you have SOC 2, self-hosting, and Java support?",
 say:"I do not have dates and I will not invent them. Today it is an online service and Python agents. I will note your interest in each and come back to you.",
 pts:["No dates","Says what exists today","Notes interest"],
 avoid:["Promising features or quarters"]},
{id:"send-info",c:"close",p:"jan",
 q:"Sounds interesting. Just send me some information and I will have a look.",
 say:"Happy to. To send the right thing: which agent would you try this on first, and who else should see it, your CTO or legal? I will send a 3-minute video and a one-page summary you can forward. May I check in on Thursday?",
 pts:["Agrees, then asks a question","Finds the real agent and the other decision makers","Sends a concrete item","Fixes a check-in day"],
 avoid:["Ending with “let us stay in touch”","Sending a long document pack"],
 tip:"The goal of every call is ONE next step with a date."},
{id:"not-now",c:"close",p:"tom",
 q:"We are busy right now. Maybe next quarter.",
 say:"Understood. May I ask what is the main reason, is it timing, or is there something about the idea itself? The pilot is small and our team does the connecting in under an hour. If not now, may I check back in a few weeks?",
 pts:["Stays calm","Asks the real reason","Mentions how small the pilot is","Asks permission to follow up"],
 avoid:["Pushing","Discounts"],
 tip:"A “no” with a reason is valuable. Write it down and send it to Giovanni."},
{id:"boss",c:"close",p:"jan",
 q:"I like it, but I need to talk to my boss.",
 say:"Of course. I will send you a 3-minute video and a one-page summary that you can forward. What will your boss care about most? And may I check in on a day that suits you?",
 pts:["Supportive","Provides something forwardable","Learns what the boss cares about","Fixes a check-in day"],
 avoid:["Asking to talk to the boss directly right away"]}
];

/* Full-call scenarios: fixed order, one persona for the whole call. */
var SCEN=[
 {id:"s1",n:"Skeptical CTO (fintech)",d:"Technical, short on time, tests whether you bluff. 9 questions.",persona:"marco",
  ids:["what","logs","fake","connect","perf","down","audit","price","send-info"]},
 {id:"s2",n:"Compliance head (insurance)",d:"Careful and legal. Wants honesty about limits. 9 questions.",persona:"elena",
  ids:["who-needs","content","where","aiact","audit","verify","firebase","no-customers","boss"]},
 {id:"s3",n:"Founder of an AI agency",d:"Fast, practical, will ask about code and price. 9 questions.",persona:"tom",
  ids:["what","diy","connect","frameworks","opensource","api","price","pilot","not-now"]},
 {id:"s4",n:"Legal counsel (tough)",d:"Every answer must be careful. 8 questions.",persona:"sofia",
  ids:["aiact","court","gdpr-dpa","erasure","hacked","training","company","boss"]}
];

/* ------------------------- app logic ------------------------- */
var $=function(s){return document.querySelector(s)};
var app=document.getElementById("app");
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
           set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var prog=store.get("sigillo-sim-progress",{});   // id -> {last:0..1, best:0..1, n:count}
var marked=store.get("sigillo-sim-marked",{});    // id -> true
var voiceOn=store.get("sigillo-sim-voice",false);
var S=null;  // session state
var timerH=null;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function byId(id){for(var i=0;i<Q.length;i++)if(Q[i].id===id)return Q[i]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function save(){store.set("sigillo-sim-progress",prog);store.set("sigillo-sim-marked",marked)}
function initials(n){return n.slice(0,1)}

function home(){
 clearInterval(timerH);S=null;stopSpeak();
 var done=Object.keys(prog).length, weak=Q.filter(function(q){return prog[q.id]&&prog[q.id].last<0.7}).length, mk=Object.keys(marked).filter(function(k){return marked[k]}).length;
 var h='<h1>Sigillo call simulator</h1><p class="mut">Practice the first call with a company that uses AI agents. A client asks, you answer out loud or in writing, then you see the model answer and check yourself. No account, no internet needed, nothing is sent anywhere.</p>';
 h+='<div class="card"><h2>How it works</h2><p>1. Read (or listen to) the client question. 2. Answer in your own words, out loud or typed. 3. Press <b>Show model answer</b>, tick the key points you covered. 4. Repeat until it feels natural.</p><p class="mut">Tip: practise out loud. Answer in 20 to 40 seconds, like in a real call. If you do not know, use the saving phrase: <i>“Good question. I\'ll check with the team and come back to you today.”</i></p></div>';
 h+='<h2 style="margin-top:22px">Choose a practice mode</h2>';
 h+='<button class="big" data-a="scen"><b>Full call simulation</b><span>A client persona asks 8 or 9 questions in a row, like a real call. Score at the end.</span></button>';
 h+='<button class="big" data-a="quick"><b>Quick random, 10 questions</b><span>Mixed questions from every topic, in random order.</span></button>';
 h+='<button class="big" data-a="topic"><b>By topic</b><span>Drill one area: data and privacy, security, legal, price, closing.</span></button>';
 h+='<button class="big" data-a="weak"'+(weak+mk?'':' disabled')+'><b>Review: marked and weak</b><span>'+(weak+mk?(mk+' marked, '+weak+' scored under 70%'):'Nothing yet. Mark questions with the star or score low and they appear here.')+'</span></button>';
 h+='<button class="big" data-a="all"><b>Study mode: read all answers</b><span>Browse every question with its model answer, no scoring.</span></button>';
 h+='<div class="card"><div class="row"><span class="mut">'+done+' of '+Q.length+' questions practised</span><span class="sp"></span><label class="mut"><input type="checkbox" id="vo"'+(voiceOn?' checked':'')+'> Read questions aloud</label><button id="rs">Reset progress</button></div></div>';
 h+='<div class="card mut"><b>Golden rules</b><br>Never guess, never invent a number, never promise a feature or a date. Say “tamper-evident” and “independently verifiable”, not “tamper-proof”, “compliant” or “AI Act ready”. End every call with ONE next step and a date.</div>';
 app.innerHTML=h;
 app.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){menu(b.dataset.a)}});
 $("#vo").onchange=function(e){voiceOn=e.target.checked;store.set("sigillo-sim-voice",voiceOn)};
 $("#rs").onclick=function(){if(confirm("Delete all saved progress and marks?")){prog={};marked={};save();home()}};
}

function menu(a){
 if(a==="quick")return start({title:"Quick random",ids:shuffle(Q.map(function(q){return q.id})).slice(0,10)});
 if(a==="all")return study();
 if(a==="weak"){var ids=Q.filter(function(q){return marked[q.id]||(prog[q.id]&&prog[q.id].last<0.7)}).map(function(q){return q.id});return start({title:"Review",ids:shuffle(ids)})}
 var h='<p><button id="bk">← Back</button></p>';
 if(a==="scen"){
  h+='<h1>Full call simulation</h1><p class="mut">Pick who is on the other side of the table.</p>';
  SCEN.forEach(function(s){var p=PERSONAS[s.persona];h+='<button class="big" data-s="'+s.id+'"><b>'+esc(s.n)+'</b><span>'+esc(s.d)+'</span></button>'});
 } else {
  h+='<h1>By topic</h1>';
  Object.keys(CATS).forEach(function(k){var n=Q.filter(function(q){return q.c===k}).length;h+='<button class="big" data-t="'+k+'"><b>'+esc(CATS[k])+'</b><span>'+n+' questions</span></button>'});
 }
 app.innerHTML=h;
 $("#bk").onclick=home;
 app.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){var s=SCEN.filter(function(x){return x.id===b.dataset.s})[0];start({title:s.n,ids:s.ids,persona:s.persona,scen:true})}});
 app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){var k=b.dataset.t;start({title:CATS[k],ids:shuffle(Q.filter(function(q){return q.c===k}).map(function(q){return q.id}))})}});
}

function start(cfg){
 S={cfg:cfg,i:0,res:[],t0:0,revealed:false};
 if(cfg.scen){
  var p=PERSONAS[cfg.persona];
  app.innerHTML='<p><button id="bk">← Back</button></p><h1>'+esc(cfg.title)+'</h1><div class="card"><div class="who"><div class="av">'+initials(p.n)+'</div><div><b>'+esc(p.n)+'</b><div class="mut">'+esc(p.r)+'</div></div></div><p>You are on a video call. Say hello in one sentence, say you will keep it to 30 minutes, and say that you will show a short demo. Then the questions start. Answer as you would in the real call.</p><p class="mut">Remember: you talk about 30%, they talk about 70%.</p><button class="pri" id="go">Start the call</button></div>';
  $("#bk").onclick=home;$("#go").onclick=function(){ask()};
 } else ask();
}

function ask(){
 var cfg=S.cfg,q=byId(cfg.ids[S.i]);S.q=q;S.revealed=false;S.push=false;S.t0=Date.now();
 var pk=cfg.persona||q.p,p=PERSONAS[pk];
 var h='<div class="row"><button id="bk">✕ Quit</button><span class="sp"></span><span class="mut">'+esc(cfg.title)+' · '+(S.i+1)+' / '+cfg.ids.length+'</span></div><div class="bar"><i style="width:'+(S.i/cfg.ids.length*100)+'%"></i></div>';
 h+='<div class="card"><div class="who"><div class="av">'+initials(p.n)+'</div><div><b>'+esc(p.n)+'</b> <span class="mut">· '+esc(p.r)+'</span><br><span class="tag">'+esc(CATS[q.c])+'</span></div><span class="sp"></span><button class="star'+(marked[q.id]?' on':'')+'" id="st" title="Mark for review">★</button></div>';
 h+='<div class="q">“'+esc(q.q)+'”</div>';
 h+='<div class="row" style="margin-bottom:10px"><button id="hear">🔊 Hear it</button><button id="mic" class="hide">🎤 Speak</button><span class="sp"></span><span class="timer" id="tm">0:00</span></div>';
 h+='<textarea id="ans" placeholder="Answer out loud, or type your answer here (optional)…"></textarea>';
 h+='<div class="row" style="margin-top:12px"><button class="pri" id="rev">Show model answer</button><button id="skip">Skip</button></div><div id="res"></div></div>';
 app.innerHTML=h;
 window.scrollTo(0,0);
 $("#bk").onclick=function(){if(S.res.length&&!confirm("Quit this session?"))return;home()};
 $("#st").onclick=function(e){marked[q.id]=!marked[q.id];e.target.classList.toggle("on",marked[q.id]);save()};
 $("#hear").onclick=function(){speak(q.q)};
 $("#rev").onclick=reveal;
 $("#skip").onclick=function(){S.res.push({id:q.id,sc:0,skipped:true});next()};
 clearInterval(timerH);timerH=setInterval(function(){var s=Math.floor((Date.now()-S.t0)/1000);var el=$("#tm");if(el)el.textContent=Math.floor(s/60)+":"+("0"+s%60).slice(-2)},500);
 setupMic();
 if(voiceOn)speak(q.q);
}

function reveal(){
 var q=S.q;S.revealed=true;clearInterval(timerH);stopSpeak();stopMic();
 $("#rev").classList.add("hide");$("#skip").classList.add("hide");
 var h='<div class="box say"><h3>Model answer</h3>'+esc(q.say)+'</div>';
 h+='<div class="box" style="background:var(--acc2)"><h3>Tick what you covered</h3>';
 q.pts.forEach(function(p,i){h+='<label class="pt"><input type="checkbox" class="pc" data-i="'+i+'"><span>'+esc(p)+'</span></label>'});
 h+='</div>';
 if(q.avoid&&q.avoid.length){h+='<div class="box avoid"><h3>Do not say</h3><ul style="margin:0;padding-left:20px">'+q.avoid.map(function(a){return'<li>'+esc(a)+'</li>'}).join("")+'</ul><label class="pt" style="border:0;margin-top:6px"><input type="checkbox" id="slip"><span>I said one of these (honest check)</span></label></div>'}
 if(q.tip)h+='<div class="box tip"><h3>Coach note</h3>'+esc(q.tip)+'</div>';
 if(q.push)h+='<div id="pushwrap"><button id="pushb">😬 Client pushes back…</button></div>';
 h+='<div class="row" style="margin-top:14px"><span class="sp"></span><button class="pri" id="nx">'+(S.i+1<S.cfg.ids.length?'Next question →':'Finish')+'</button></div>';
 $("#res").innerHTML=h;
 var pb=$("#pushb");
 if(pb)pb.onclick=function(){
  S.push=true;var pk=S.cfg.persona||q.p;
  $("#pushwrap").innerHTML='<div class="box" style="background:var(--warnbg)"><h3>'+esc(PERSONAS[pk].n)+' says</h3><b>“'+esc(q.push.q)+'”</b><p class="mut" style="margin-top:8px">Answer it out loud first, then open the suggestion.</p><button id="pushr">Show suggestion</button><div id="pushans"></div></div>';
  if(voiceOn)speak(q.push.q);
  $("#pushr").onclick=function(){$("#pushans").innerHTML='<div class="box say" style="margin-bottom:0"><h3>Suggested reply</h3>'+esc(q.push.say)+'</div>';$("#pushr").classList.add("hide")};
 };
 $("#nx").onclick=function(){
  var tot=q.pts.length,got=document.querySelectorAll(".pc:checked").length,slip=$("#slip")&&$("#slip").checked;
  var sc=Math.max(0,got/tot-(slip?0.25:0));
  S.res.push({id:q.id,sc:sc,slip:slip,secs:Math.round((Date.now()-S.t0)/1000)});
  var pr=prog[q.id]||{best:0,n:0};prog[q.id]={last:sc,best:Math.max(pr.best,sc),n:pr.n+1};
  if(sc<0.5)marked[q.id]=true;
  save();next();
 };
 $("#res").scrollIntoView({behavior:"smooth",block:"start"});
}

function next(){
 S.i++;
 if(S.i>=S.cfg.ids.length)return summary();
 ask();
}

function summary(){
 clearInterval(timerH);stopSpeak();
 var r=S.res.filter(function(x){return!x.skipped}),avg=r.length?r.reduce(function(a,x){return a+x.sc},0)/r.length:0;
 var pct=Math.round(avg*100);
 var verdict=pct>=85?"Excellent. You sound ready.":pct>=70?"Good. Review the red lines below and run it once more.":pct>=50?"Getting there. Repeat the weak questions out loud.":"Keep practising. Read the model answers in study mode, then try again.";
 var h='<h1>Result</h1><div class="card"><div class="score">'+pct+'%</div><p>'+verdict+'</p><div class="bar"><i style="width:'+pct+'%"></i></div>';
 h+='<table><tr><th>Question</th><th>Score</th></tr>';
 S.res.forEach(function(x){var q=byId(x.id);h+='<tr><td>'+esc(q.q)+(x.slip?' <span class="tag" style="background:var(--badbg);color:var(--bad)">said a “do not say”</span>':'')+'</td><td>'+(x.skipped?'skipped':Math.round(x.sc*100)+'%')+'</td></tr>'});
 h+='</table></div>';
 var weak=S.res.filter(function(x){return x.skipped||x.sc<0.7}).map(function(x){return x.id});
 h+='<div class="row">'+(weak.length?'<button class="pri" id="rw">Repeat the '+weak.length+' weak ones</button>':'')+'<button id="again">Again, same set</button><button id="hm">Home</button></div>';
 h+='<p class="mut" style="margin-top:16px">After a real call: write down the questions you could not answer and send them to Giovanni the same day.</p>';
 app.innerHTML=h;window.scrollTo(0,0);
 var cfg=S.cfg;
 if(weak.length)$("#rw").onclick=function(){start({title:"Weak ones",ids:shuffle(weak)})};
 $("#again").onclick=function(){start({title:cfg.title,ids:cfg.scen?cfg.ids:shuffle(cfg.ids),persona:cfg.persona,scen:cfg.scen})};
 $("#hm").onclick=home;
}

function study(){
 var h='<p><button id="bk">← Back</button></p><h1>Study mode</h1><p class="mut">All questions with model answers. Tap a question to open it.</p>';
 Object.keys(CATS).forEach(function(k){
  h+='<h2 style="margin-top:20px">'+esc(CATS[k])+'</h2>';
  Q.filter(function(q){return q.c===k}).forEach(function(q){
   h+='<details class="card" style="padding:12px 16px"><summary style="cursor:pointer;font-weight:600">'+esc(q.q)+'</summary><div class="box say"><h3>Model answer</h3>'+esc(q.say)+'</div><div class="box" style="background:var(--acc2)"><h3>Key points</h3><ul style="margin:0;padding-left:20px">'+q.pts.map(function(p){return'<li>'+esc(p)+'</li>'}).join("")+'</ul></div>'+
   (q.avoid?'<div class="box avoid"><h3>Do not say</h3><ul style="margin:0;padding-left:20px">'+q.avoid.map(function(a){return'<li>'+esc(a)+'</li>'}).join("")+'</ul></div>':'')+
   (q.push?'<div class="box tip"><h3>If pushed: “'+esc(q.push.q)+'”</h3>'+esc(q.push.say)+'</div>':'')+
   (q.tip?'<div class="box tip"><h3>Coach note</h3>'+esc(q.tip)+'</div>':'')+'</details>';
  });
 });
 app.innerHTML=h;$("#bk").onclick=home;
}

/* ---- voice: browser text-to-speech and speech recognition, both optional ---- */
function speak(t){
 try{stopSpeak();var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=0.95;speechSynthesis.speak(u)}catch(e){}
}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}}
var rec=null;
function setupMic(){
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return;
 var b=$("#mic");if(!b)return;b.classList.remove("hide");
 var on=false;
 b.onclick=function(){
  if(on){stopMic();return}
  try{
   rec=new SR();rec.lang="en-GB";rec.continuous=true;rec.interimResults=false;
   var base=$("#ans").value;
   rec.onresult=function(e){var t="";for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript+" ";$("#ans").value=(base?base+" ":"")+t.trim()};
   rec.onend=function(){on=false;b.textContent="🎤 Speak"};
   rec.onerror=function(){on=false;b.textContent="🎤 Speak"};
   rec.start();on=true;b.textContent="⏹ Stop";
  }catch(e){}
 };
}
function stopMic(){try{if(rec)rec.stop()}catch(e){}rec=null}

home();
</script>
</body>
</html>
