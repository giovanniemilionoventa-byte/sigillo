name: Dependency audit

# Known vulnerabilities in the dependencies, checked against public advisory
# databases: the npm registry's for the pnpm workspace, PyPI's for the Python
# SDK. See docs/DEPENDENCY-AUDIT.md for what a failure means and what to do.
#
# It runs on every push and pull request, and also every week on its own: an
# advisory can be published against a version already in use without any
# commit here, and the Python requirements are not pinned at all. (GitHub runs
# scheduled workflows on the default branch only.)

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pnpm audit reads pnpm-lock.yaml: nothing needs to be installed.
      - name: every advisory, for the record (does not fail the job)
        run: pnpm audit
        continue-on-error: true
      - name: production dependencies, any severity
        run: pnpm audit --prod
      - name: development dependencies, high or critical
        run: pnpm audit --dev --audit-level high

  python:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned, so that a change in the tool is a commit here and not a surprise.
      - run: pip install pip-audit==2.10.1
      - run: python scripts/audit_python.py
